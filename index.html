<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="跑單路線">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="跑單路線">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>機車跑單 · 路線優化</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f1720;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  color:#e8eef5;-webkit-text-size-adjust:100%;
  /* ★ 騎車要看清楚：字級放大由 --ui 控制（1 = 標準，1.25 = 大字，1.5 = 超大） */
  font-size:calc(16px * var(--ui, 1.25))}
/* 全域字級跟隨 --ui；個別固定 px 的元素用 calc 換算 */
#uiBig{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:1001;
  background:#1e2c3a;color:#7dd3fc;border:1px solid #2b3a4a;border-radius:10px;
  padding:8px 10px;font-size:0.8125rem;font-weight:700;cursor:pointer;display:none}
#map{position:absolute;inset:0;z-index:1;background:#1a2430}

#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;
  background:linear-gradient(180deg,rgba(15,23,32,.97),rgba(15,23,32,.85) 65%,transparent);
  pointer-events:none}
#topbar .row{display:flex;align-items:center;gap:8px;pointer-events:auto}
#title{font-size:0.8125rem;font-weight:700;color:#7dd3fc;flex:1;letter-spacing:.3px}
#badge{font-size:0.6250rem;padding:2px 7px;border-radius:20px;background:#0d4f6e;
  color:#7dd3fc;border:1px solid #1a6f94;font-weight:600;white-space:nowrap}
#stat{font-size:0.6875rem;color:#94a3b8;text-align:right;line-height:1.35;max-width:48%;
  font-variant-numeric:tabular-nums}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;
  background:rgba(22,32,44,.975);backdrop-filter:blur(16px);
  border-radius:18px 18px 0 0;border-top:1px solid rgba(125,211,252,.22);
  box-shadow:0 -8px 32px rgba(0,0,0,.55);
  padding:6px 12px calc(env(safe-area-inset-bottom) + 10px);
  max-height:74vh;display:flex;flex-direction:column;
  transition:transform .22s cubic-bezier(.4,0,.2,1)}
#sheet.collapsed{transform:translateY(calc(100% - 52px))}
#handle{width:38px;height:4px;border-radius:2px;background:#3d4f63;
  margin:2px auto 7px;flex:0 0 auto}

#inputwrap{display:flex;gap:7px;margin-bottom:8px;flex:0 0 auto}
#addr{flex:1;background:#0e1720;border:1px solid #2b3a4a;border-radius:11px;
  padding:11px 13px;color:#e8eef5;font-size:0.9375rem;outline:none;min-width:0}
#addr::placeholder{color:#5a6b7d}
#addr:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.iconbtn{width:44px;height:44px;flex:0 0 auto;border-radius:11px;
  background:#1e2c3a;color:#7dd3fc;font-size:1.1875rem;display:flex;
  align-items:center;justify-content:center;cursor:pointer;border:1px solid #2b3a4a;
  user-select:none}
.iconbtn:active{background:#26384a}

#sug{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;
  background:#0e1720;border:1px solid #2b3a4a;border-radius:11px;overflow:hidden;
  display:none;max-height:38vh;overflow-y:auto;z-index:1200;
  box-shadow:0 -6px 24px rgba(0,0,0,.6)}
#sug div{padding:10px 13px;font-size:0.8125rem;border-bottom:1px solid #1c2836;cursor:pointer}
#sug div:last-child{border-bottom:none}
#sug div:active{background:#1a2836}
#sug .nm{color:#e8eef5;font-weight:600;line-height:1.35}
#sug .ad{color:#7a8ca0;font-size:0.6875rem;margin-top:2px;line-height:1.3}

#list{flex:0 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:0 -4px;padding:0 4px;min-height:40px;max-height:26vh}
.item{display:flex;align-items:center;gap:9px;background:#131e2a;
  border:1px solid #243342;border-radius:11px;padding:9px 10px;margin-bottom:6px;
  cursor:grab;position:relative}
.item.start{background:#132a20;border-color:#2d6a4f}
.item.dragging{opacity:.4;border-color:#0ea5e9}
.item .num{width:26px;height:26px;flex:0 0 auto;border-radius:50%;
  background:#0ea5e9;color:#001824;font-size:0.8125rem;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.item.start .num{background:#22c55e;color:#00220d}
.item .body{flex:1;min-width:0}
.item .nm{font-size:0.8438rem;font-weight:600;color:#e8eef5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:0.6875rem;color:#7a8ca0;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .leg{font-size:0.6562rem;color:#38bdf8;margin-top:2px;
  font-variant-numeric:tabular-nums}
.item .del{width:30px;height:30px;flex:0 0 auto;border:none;background:transparent;
  color:#6b7d90;font-size:1.0625rem;cursor:pointer;border-radius:8px;padding:0}
.item .del:active{background:#3a1f24;color:#f87171}

#actions{display:flex;gap:8px;margin-top:8px;flex:0 0 auto}
.btn{flex:1;border:none;border-radius:12px;padding:14px 8px;font-size:0.9375rem;
  font-weight:700;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:scale(.985)}
#go{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
  box-shadow:0 4px 14px rgba(14,165,233,.35)}
#go:disabled{background:#243342;color:#5a6b7d;box-shadow:none}
#nav{background:linear-gradient(135deg,#22c55e,#16a34a);color:#03240f;
  box-shadow:0 4px 14px rgba(34,197,94,.3);display:none}
#nav.show{display:block}
#clear{flex:0 0 58px;background:#1e2c3a;color:#94a3b8;border:1px solid #2b3a4a}

/* 方案卡 */
#plans{display:none;margin-top:8px;flex:0 1 auto;overflow-y:auto;max-height:34vh}
#plans.show{display:block}
#planhdr{font-size:0.6562rem;color:#7a8ca0;margin-bottom:5px;
  display:flex;justify-content:space-between;align-items:center}
#planhdr b{color:#7dd3fc;font-size:0.6875rem}
#sortby{font-size:0.6250rem;padding:3px 8px;border-radius:20px;background:#1e2c3a;
  border:1px solid #2b3a4a;color:#8fa3b8;cursor:pointer}
.plan{display:flex;align-items:center;gap:8px;background:#131e2a;
  border:1px solid #243342;border-radius:11px;padding:8px 10px;margin-bottom:5px;
  cursor:pointer;transition:.13s}
.plan.on{border-color:#0ea5e9;background:#0f2a3a}
.plan.best{border-color:#22c55e}
.plan .tag{font-size:0.5938rem;padding:2px 6px;border-radius:20px;font-weight:700;
  flex:0 0 auto;white-space:nowrap;min-width:44px;text-align:center}
.plan .tag.a{background:#1e3a5f;color:#7dd3fc}
.plan .tag.b{background:#3a2f1e;color:#fcd34d}
.plan .tag.c{background:#1e3a2a;color:#6ee7b7}
.plan .tag.d{background:#2e1e3a;color:#c4b5fd}
.plan .tag.e{background:#3a1e1e;color:#fca5a5}
.plan .inf{flex:1;min-width:0}
.plan .d{font-size:0.7812rem;font-weight:700;font-variant-numeric:tabular-nums;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.plan .d .sig{font-size:0.6562rem;color:#fbbf24;font-weight:600}
.plan .d .sig.good{color:#22c55e}
.plan .d .sig.bad{color:#f87171}
.plan .n{font-size:0.6250rem;color:#7a8ca0;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .rad{width:15px;height:15px;border-radius:50%;border:2px solid #3d4f63;
  flex:0 0 auto}
.plan.on .rad{border-color:#0ea5e9;background:#0ea5e9;
  box-shadow:inset 0 0 0 3px #0f2a3a}
.plan .star{font-size:0.5625rem;color:#22c55e;font-weight:700;flex:0 0 auto}

#chkmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:9500;align-items:center;justify-content:center;padding:18px}
#chkmodal.show{display:flex}

/* 離線地圖面板 */
#offPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:9600;align-items:center;justify-content:center;padding:16px}
#offPanel.show{display:flex}
#offBox{background:#111c26;border:1px solid #243342;border-radius:14px;
  max-width:400px;width:100%;padding:16px;color:#dbe7f3;font-size:0.875rem}
#offT{font-size:1rem;font-weight:800;color:#fff;margin-bottom:4px}
#offSub{font-size:0.75rem;color:#7a8ca0;margin-bottom:12px;line-height:1.45}
#offRegion{width:100%;padding:11px 12px;border-radius:10px;background:#0e1720;
  color:#e8eef5;border:1px solid #2b3a4a;font-size:0.875rem;margin-bottom:10px}
#offStored{font-size:0.8125rem;color:#7dd3fc;margin-bottom:8px}
#offBarWrap{height:10px;border-radius:5px;background:#1a2836;overflow:hidden;margin-bottom:6px}
#offBar{height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#22c55e);transition:width .25s}
#offTxt{font-size:0.8125rem;color:#94a3b8;margin-bottom:12px;font-variant-numeric:tabular-nums}
#offBtns{display:flex;gap:8px;margin-bottom:10px}
#offBtns .btn{padding:13px 8px;font-size:0.875rem}
#offNote{font-size:0.6875rem;color:#6b7d90;line-height:1.5;
  border-top:1px solid #1c2836;padding-top:9px}
#chkbox{background:#111c26;border:1px solid #1e2b38;border-radius:14px;
  max-width:360px;width:100%;padding:14px 16px;color:#dbe7f3;
  max-height:72vh;overflow:auto}
#chkt{font-size:0.9375rem;font-weight:800;margin-bottom:8px;color:#fff}
.chkrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid #17222e;font-size:0.7500rem;line-height:1.45}
.chkrow b{font-weight:700;color:#9fb3c8;flex:0 0 auto}
.chkrow span{text-align:right;color:#e8f0f7}
.chkrow span.warn{color:#fbbf24}
.chkrow span.bad{color:#f87171}
#chkbtns{display:flex;gap:8px;margin-top:12px}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  background:rgba(10,18,26,.96);border:1px solid #2b3a4a;color:#e8eef5;
  padding:11px 19px;border-radius:12px;font-size:0.8125rem;z-index:2000;
  max-width:84vw;text-align:center;line-height:1.45;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.pin{width:28px;height:28px;border-radius:50%;background:#0ea5e9;color:#001824;
  font-size:0.8125rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:2.5px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.6)}
.pin.s{background:#22c55e;color:#00220d}
#diaoboBar{display:none;position:absolute;left:0;right:0;
  top:calc(env(safe-area-inset-top) + 0px);z-index:1001;
  background:linear-gradient(135deg,#b91c1c,#991b1b);color:#fff;
  padding:8px 14px;font-size:0.7812rem;font-weight:700;text-align:center;
  box-shadow:0 3px 14px rgba(185,28,28,.55);line-height:1.4}
#diaoboBar.show{display:block}
#diaoboBar .sub{font-size:0.6562rem;font-weight:500;opacity:.92;margin-top:2px}

.warnbox{background:#3a1a1a;border:1px solid #7f1d1d;border-radius:11px;
  padding:9px 11px;margin-bottom:6px;font-size:0.7188rem;color:#fca5a5;line-height:1.45}
.warnbox b{color:#f87171}
.plan .warn{font-size:0.5938rem;color:#f87171;font-weight:700;margin-left:3px}
.plan .avoided{font-size:0.5938rem;color:#22c55e;font-weight:700;margin-left:3px}
.plan .caution{font-size:0.5938rem;color:#fbbf24;font-weight:700;margin-left:3px}
#diaoboNote{display:none;background:#132a20;border:1px solid #2d6a4f;
  border-radius:10px;padding:8px 11px;margin-bottom:6px;font-size:0.7188rem;
  color:#86efac;line-height:1.5}
#diaoboNote.show{display:block}
#diaoboNote b{color:#4ade80}

.leaflet-control-attribution{background:rgba(10,18,26,.78)!important;
  color:#5a6b7d!important;font-size:0.5625rem!important;padding:1px 5px!important}
.leaflet-control-attribution a{color:#6b8299!important}
</style>
</head>
<body>

<div id="map"></div>

<div id="diaoboBar"></div>

<div id="topbar">
  <div class="row">
    <div id="title">機車跑單</div>
    <div id="badge">機車</div>
    <div id="stat">尚未加入地點</div>
  </div>
</div>

<div id="sheet">
  <div id="handle"></div>

  <div id="inputwrap">
    <input id="addr" type="search" placeholder="輸入地址或店名…" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="iconbtn" id="gps">◎</div>
    <div class="iconbtn" id="add">＋</div>
  </div>
  <div id="sug"></div>

  <div id="list"></div>

  <div id="plans">
    <div id="diaoboNote"></div>
    <div id="planhdr">
      <span>共 <b id="pcount">0</b> 條路線</span>
      <span id="sortby">排序：路口最少</span>
    </div>
  </div>

  <div id="actions">
    <button class="btn" id="off" style="flex:0 0 auto" title="離線地圖">📥 離線</button>
    <button class="btn" id="chk" style="flex:0 0 auto" title="手機自檢">🔧 自檢</button>
    <button class="btn" id="uiBig" style="flex:0 0 auto" title="字體大小">AA</button>
    <button class="btn" id="clear">清除</button>
    <button class="btn" id="go">計算最佳路線</button>
    <button class="btn" id="nav">開始導航</button>
  </div>
</div>

<div id="chkmodal">
  <div id="chkbox">
    <div id="chkt">🔧 手機自檢</div>
    <div id="chkrows"></div>
    <div id="chkbtns">
      <button class="btn" id="chkspeak">🔊 試唸一句</button>
      <button class="btn" id="chkclose">關閉</button>
    </div>
  </div>
</div>

<!-- ═══════ 離線地圖下載 ═══════ -->
<div id="offPanel">
  <div id="offBox">
    <div id="offT">📥 離線地圖</div>
    <div id="offSub">訊號差的巷子、地下室、山區，先把圖存到手機</div>

    <select id="offRegion">
      <option value="corridor">中永和 ⇄ 台北市（含所有跨河橋）11,424張 ≈ 245MB</option>
      <option value="core">中永和·板橋·台北西區 4,570張 ≈ 98MB</option>
      <option value="all">雙北全境 23,899張 ≈ 513MB</option>
    </select>

    <div id="offStored">檢查中…</div>
    <div id="offBarWrap"><div id="offBar"></div></div>
    <div id="offTxt">尚未開始</div>

    <div id="offBtns">
      <button class="btn" id="offStart">開始下載</button>
      <button class="btn" id="offCancel">停止</button>
      <button class="btn" id="offClose">關閉</button>
    </div>

    <div id="offNote">
      ⚠️ 下載要連 WiFi，約需 20~40 分鐘。可以中途關掉，下次按「開始下載」會從中斷處續傳。
      <br>下載完後，地圖在沒訊號時也能顯示；但「走錯路重新算路線」仍需網路。
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="diaobo.js"></script>
<script src="leftrule.js"></script>
<script src="motorban.js"></script>
<script src="navrotate.js"></script>
<script src="junction.js"></script>
<script src="nav.js"></script>
<script src="offline-map.js"></script>
<script>
"use strict";

var VALHALLA = "https://valhalla1.openstreetmap.de";
var OSRM = "https://router.project-osrm.org";

/* ═══════ 備援引擎：公開 Valhalla 常被限流，掛了要能改走 OSRM ═══════
   注意：OSRM 只有 driving（汽車）模型，沒有機車專用道概念，
   所以只在 Valhalla 完全失敗時當救命用，並在畫面上明說。 */
function routeFallbackOSRM(locs){
  var coords = locs.map(function(c){ return c.lng + "," + c.lat; }).join(";");
  var url = OSRM + "/route/v1/driving/" + coords +
            "?overview=full&geometries=polyline6&steps=true";
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error("osrm " + r.status);
    return r.json();
  }).then(function(d){
    if(!d.routes || !d.routes.length) throw new Error("osrm no route");
    var route = d.routes[0];
    var geo = decodePolyline(route.geometry);
    var names = [], turns = 0;
    var maneuvers = [];
    var cum = 0;
    route.legs.forEach(function(leg){
      leg.steps.forEach(function(st){
        turns++;
        if(st.name && names.indexOf(st.name) < 0) names.push(st.name);
      });
    });
    // 轉成 App 內部 maneuver 格式（讓內建導航能用）
    var idxGeo = 0, acc = 0;
    route.legs.forEach(function(leg){
      leg.steps.forEach(function(st, si){
        acc += st.distance;
        maneuvers.push({
          type: st.maneuver && st.maneuver.type ? 10 : 10,
          text: (st.maneuver && st.maneuver.modifier) ? ("往" + st.maneuver.modifier) : "直行",
          street: st.name || "",
          length: st.distance,
          cumStart: acc - st.distance,
          lat: (st.maneuver && st.maneuver.location) ? st.maneuver.location[1] : null,
          lng: (st.maneuver && st.maneuver.location) ? st.maneuver.location[0] : null
        });
      });
    });
    return {
      distance: route.distance,
      duration: route.duration,
      engineTime: route.duration,
      waitSignal: 0,
      geometry: geo,
      legs: route.legs.map(function(l){ return {distance: l.distance, duration: l.duration}; }),
      names: names,
      maneuvers: maneuvers,
      signals: 0,
      turns: turns,
      alleys: names.filter(function(n){ return /\d+巷|\d+弄/.test(n); }).length,
      engine: "osrm"
    };
  });
}
var PHOTON   = "https://photon.komoot.io/api/";
var LS_KEY   = "moto_route_v3";

var pts = [], order = [], route = null;
var plans = [], activePlan = 0, sortMode = "signal";
var map, layerLine, layerPins, userMarker;

/* ═══════ 五种策略（全部实际计算，按结果排序）═══════ */
var STRATS = {
  fast: { label:"最快", cfg:{}, color:"#0ea5e9" },
  alley:{ label:"鑽小巷", cfg:{ use_primary:0.0, use_secondary:0.0,
          use_tertiary:0.3, use_residential:1.0,
          use_living_streets:1.0, use_service_roads:1.0 }, color:"#fbbf24" },
  short:{ label:"最短距離", cfg:{ shortest:true }, color:"#34d399" },
  nopri:{ label:"避主幹道", cfg:{ use_primary:0.0, use_secondary:0.2,
          use_tertiary:0.8, use_residential:1.0,
          use_living_streets:1.0 }, color:"#c084fc" },
  slow: { label:"慢速優先", cfg:{ top_speed:40, use_primary:0.3,
          use_secondary:0.5 }, color:"#f87171" }
};
var STRAT_KEYS = ["fast","alley","short","nopri","slow"];
var TAG_CLASS = { fast:"a", alley:"b", short:"c", nopri:"d", slow:"e" };

/* ═══════ 調撥路段座標（用於強制避開）═══════ */
var DIAOBO_COORDS = {
  "民權東路":{lat:25.0621,lng:121.5455}, "水源路":{lat:25.0185,lng:121.5290},

/* ═══════ 点管理 ═══════ */
function addPoint(name,lat,lng,silent){
  for(var i=0;i<pts.length;i++){
    var dy=(pts[i].lat-lat)*111320;
    var dx=(pts[i].lng-lng)*111320*Math.cos(lat*Math.PI/180);
    if(Math.hypot(dx,dy)<10){ toast("這個點已在清單中"); return; }
  }
  pts.push({name:name,lat:lat,lng:lng});
  order=[]; route=null; plans=[];
  render(); save();
  if(!silent) toast("已加入 "+name,1000);
}
function delPoint(i){ pts.splice(i,1); order=[]; route=null; plans=[]; render(); save(); }

/* ═══════ 渲染 ═══════ */
function render(){
  var listEl=document.getElementById("list");
  listEl.innerHTML="";
  var seq=(order.length===pts.length&&order.length)?order.slice():pts.map(function(_,i){return i;});

  seq.forEach(function(idx,pos){
    var p=pts[idx]; if(!p) return;
    var isS=pos===0;
    var div=document.createElement("div");
    div.className="item"+(isS?" start":"");
    div.draggable=true; div.dataset.idx=idx;
    var leg="";
    if(route&&route.legs&&route.legs[pos-1]){
      var lg=route.legs[pos-1];
      leg="↑ "+fmtDist(lg.distance)+" · "+fmtTime(lg.duration);
    }
    div.innerHTML='<div class="num">'+(isS?'':pos)+'</div>'+
      '<div class="body"><div class="nm"></div><div class="meta"></div>'+
      (leg?'<div class="leg">'+leg+'</div>':'')+
      '</div><button class="del">×</button>';
    div.querySelector(".nm").textContent=p.name||"未命名";
    div.querySelector(".meta").textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5);
    div.querySelector(".del").onclick=function(e){ e.stopPropagation(); delPoint(idx); };
    div.addEventListener("dragstart",function(e){
      div.classList.add("dragging"); e.dataTransfer.setData("text/plain",String(idx));
    });
    div.addEventListener("dragend",function(){ div.classList.remove("dragging"); });
    div.addEventListener("dragover",function(e){ e.preventDefault(); });
    div.addEventListener("drop",function(e){
      e.preventDefault();
      reorder(parseInt(e.dataTransfer.getData("text/plain"),10),idx);
    });
    div.onclick=function(e){
      if(e.target.classList.contains("del")) return;
      map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));
    };
    listEl.appendChild(div);
  });

  drawPins(seq); drawLine(); updateStat(); renderPlans();
}

function reorder(from,to){
  var seq=(order.length===pts.length&&order.length)?order.slice():pts.map(function(_,i){return i;});
  var a=seq.indexOf(from), b=seq.indexOf(to);
  if(a<0||b<0||a===b) return;
  var it=seq.splice(a,1)[0]; seq.splice(b,0,it);
  order=seq; route=null; plans=[];
  render(); save(); toast("已手動調整順序",900);
}

function drawPins(seq){
  layerPins.clearLayers();
  seq.forEach(function(idx,pos){
    var p=pts[idx]; if(!p) return;
    var html = pos===0 ? '<div class="pin s">起</div>' : '<div class="pin">'+pos+'</div>';
    var ic=L.divIcon({className:"",html:html,iconSize:[28,28],iconAnchor:[14,14]});
    L.marker([p.lat,p.lng],{icon:ic}).addTo(layerPins)
      .bindTooltip((pos===0?"起點":pos+". "+(p.name||"")),{direction:"top",offset:[0,-14]});
  });
}

function drawLine(){
  layerLine.clearLayers();
  if(!route||!route.geometry) return;
  var ll=route.geometry.map(function(c){ return [c[0],c[1]]; });   // geometry 已是 [lat,lng]
  var col = plans[activePlan] ? STRATS[plans[activePlan].key].color : "#0ea5e9";
  L.polyline(ll,{color:col,weight:7,opacity:.25,lineCap:"round"}).addTo(layerLine);
  L.polyline(ll,{color:col,weight:3,opacity:.95,lineCap:"round"}).addTo(layerLine);
  try{ map.fitBounds(L.latLngBounds(ll).pad(0.12)); }catch(e){}
}

function updateStat(){
  var el=document.getElementById("stat");
  if(route){
    var p0=plans[activePlan];
    var extra="";
    if(p0) extra=" · "+p0.signals+"個路口";
    el.textContent=pts.length+" 點 · "+fmtDist(route.distance)+" · "+fmtTime(route.duration)+extra;
  } else if(pts.length){
    el.textContent=pts.length+" 個點（未計算）";
  } else {
    el.textContent="尚未加入地點";
  }

  document.getElementById("badge").textContent = pts.length ? "機車 " + pts.length + "點" : "機車";
}

/* ═══════ Valhalla ═══════ */
function decodePolyline(str, precision){
  precision = precision||6;
  var idx=0,lat=0,lng=0,out=[],f=Math.pow(10,precision);
  while(idx<str.length){
    var b,shift=0,result=0;
    do{ b=str.charCodeAt(idx++)-63; result|=(b&0x1f)<<shift; shift+=5;
        if(shift>30) break; } while(b>=0x20);
    lat += (result&1)?~(result>>1):(result>>1);
    shift=0; result=0;
    do{ b=str.charCodeAt(idx++)-63; result|=(b&0x1f)<<shift; shift+=5;
        if(shift>30) break; } while(b>=0x20);
    lng += (result&1)?~(result>>1):(result>>1);
    var la=lat/f, lo=lng/f;
    // ★ 防呆：台灣範圍外的點視為解碼錯誤，直接丟棄（避免一條線畫到太平洋）
    if(isFinite(la)&&isFinite(lo)&&la>20&&la<27&&lo>117&&lo<123.5){
      out.push([la, lo]);   // Leaflet 用 [lat, lng]
    }
  }
  return out;
}

function vRoute(locs, cfg, avoid){
  var body={
    locations: locs.map(function(c){ return {lat:c.lat,lon:c.lng,type:"break"}; }),
    costing:"motor_scooter",
    directions_options:{ units:"kilometers", language:"zh-TW" }
  };
  if(cfg && Object.keys(cfg).length) body.costing_options={motor_scooter:cfg};
  if(avoid && avoid.length){
    body.avoid_locations = avoid.map(function(p){
      return {lat:p.lat, lon:p.lng, radius:p.radius||100};
    });
  }
  return fetch(VALHALLA+"/route",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("route "+r.status); return r.json(); })
    .then(function(d){
      if(!d.trip) throw new Error("no trip");
      var names=[], legs=[], sig=0, turns=0;
      d.trip.legs.forEach(function(leg){
        legs.push({distance:leg.summary.length*1000, duration:leg.summary.time});
        leg.maneuvers.forEach(function(m){
          if(m.type===9||m.type===10||m.type===11||m.type===14||m.type===15||m.type===16) sig++;
          if(m.type>=13&&m.type<=26) turns++;
          (m.street_names||[]).forEach(function(x){
            if(x && names.indexOf(x)<0) names.push(x);
          });
        });
      });
      // ★ 關鍵修正：每段 shape 必須「獨立解碼」再拼接。
      // 直接拼 polyline 字符串會讓第二段的相對位移疊加在第一段末點上，
      // 導致經度累積到 243° → 地圖跨太平洋。
      var geo=[];
      d.trip.legs.forEach(function(l){
        if(!l.shape) return;
        var seg=decodePolyline(l.shape);
        // 段與段之間的接點去重
        if(geo.length && seg.length){
          var a=geo[geo.length-1], b=seg[0];
          if(Math.abs(a[0]-b[0])<1e-7 && Math.abs(a[1]-b[1])<1e-7) seg.shift();
        }
        geo=geo.concat(seg);
      });
      if(!geo.length) geo=null;
      var s=d.trip.summary;
      // 免費引擎無紅燈號志資料，改用「路口數」當估算依据
      var waitSig=0;   // 不再假裝能算出等紅燈時間
      return {
        distance: s.length*1000,
        duration: s.time,                // 引擎預估時間（不含紅燈等待）
        engineTime: s.time,              // 引擎原始時間
        waitSignal: waitSig,
        geometry: geo,
        legs: legs, names: names,
        maneuvers: (typeof extractManeuvers==="function") ? extractManeuvers(d.trip, geo) : [],
        signals: sig, turns: turns,
        alleys: names.filter(function(n){ return /\d+巷|\d+弄/.test(n); }).length
      };
    });
}

function getMatrix(coords){
  var body={
    sources: coords.map(function(c){ return {lat:c.lat,lon:c.lng}; }),
    targets: coords.map(function(c){ return {lat:c.lat,lon:c.lng}; }),
    costing:"motor_scooter"
  };
  return fetch(VALHALLA+"/sources_to_targets",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("matrix "+r.status); return r.json(); })
    .then(function(d){
      if(!d.sources_to_targets) throw new Error("no matrix");
      return d.sources_to_targets.map(function(row){
        return row.map(function(c){ return (c&&c.time!=null)?c.time:1e9; });
      });
    })
    .catch(function(){
      // ★ 備援 1：OSRM table
      var cs = coords.map(function(c){ return c.lng+","+c.lat; }).join(";");
      return fetch(OSRM+"/table/v1/driving/"+cs+"?annotations=duration")
        .then(function(r){ if(!r.ok) throw new Error("osrm table "+r.status); return r.json(); })
        .then(function(d){
          if(!d.durations) throw new Error("no osrm durations");
          return d.durations.map(function(row){
            return row.map(function(v){ return (v==null)?1e9:v; });
          });
        })
        .catch(function(){
          // ★ 備援 2：兩家都掛 → 用直線距離估算（時速 25km/h），至少還能排順序
          return coords.map(function(a){
            return coords.map(function(b){
              return haversine(a.lat,a.lng,b.lat,b.lng) / 6.94;  // 25km/h ≈ 6.94 m/s
            });
          });
        });
    });
}

/* ═══════ TSP ═══════ */
function heldKarp(mat,n){
  var INF=1e18, m=n-1;
  if(m===0) return [0];
  var size=1<<m, dp=[], par=[];
  for(var i=0;i<size;i++){
    dp.push(new Float64Array(m).fill(INF));
    par.push(new Int8Array(m).fill(-1));
  }
  for(var j=0;j<m;j++) dp[1<<j][j]=mat[0][j+1];
  for(var mask=0;mask<size;mask++){
    for(var j2=0;j2<m;j2++){
      if(!(mask&(1<<j2))) continue;
      var cur=dp[mask][j2];
      if(cur>=INF) continue;
      for(var k=0;k<m;k++){
        if(mask&(1<<k)) continue;
        var nm=mask|(1<<k), nd=cur+mat[j2+1][k+1];
        if(nd<dp[nm][k]){ dp[nm][k]=nd; par[nm][k]=j2; }
      }
    }
  }
  var full=size-1, best=INF, bj=-1;
  for(var j3=0;j3<m;j3++) if(dp[full][j3]<best){ best=dp[full][j3]; bj=j3; }
  var seq=[], mk=full, cu=bj;
  while(cu>=0){ seq.push(cu+1); var pv=par[mk][cu]; mk&=~(1<<cu); cu=pv; }
  seq.reverse();
  return [0].concat(seq);
}

function heurTSP(mat,n){
  var used=new Array(n).fill(false); used[0]=true;
  var seq=[0], cur=0;
  for(var s=1;s<n;s++){
    var bb=-1, bd=Infinity;
    for(var i=1;i<n;i++) if(!used[i]&&mat[cur][i]<bd){ bd=mat[cur][i]; bb=i; }
    if(bb<0) break;
    used[bb]=true; seq.push(bb); cur=bb;
  }
  var imp=true,g=0;
  while(imp&&g++<200){
    imp=false;
    for(var a=1;a<n-1;a++){
      for(var b=a+1;b<n;b++){
        var d0=mat[seq[a-1]][seq[a]]+(b+1<n?mat[seq[b]][seq[b+1]]:0);
        var d1=mat[seq[a-1]][seq[b]]+(b+1<n?mat[seq[a]][seq[b+1]]:0);
        if(d1<d0-0.5){
          var seg=seq.slice(a,b+1).reverse();
          for(var k=0;k<seg.length;k++) seq[a+k]=seg[k];
          imp=true;
        }
      }
    }
  }
  return seq;
}

/* ═══════ 取得目前生效的調撥路段座標 ═══════ */
function getActiveAvoid(){
  if (typeof activeSegments !== "function") return [];
  var act = activeSegments(new Date());
  if (!act.length) return [];
  var out = [];
  act.forEach(function(x){
    if (x.seg.passable) return;      // 仍可走外側 → 不強制改道
    var c = DIAOBO_COORDS[x.seg.road];
    if (c) out.push({ road:x.seg.road, lat:c.lat, lng:c.lng, radius:90 });
  });
  return out;
}

/* ═══════ 主流程 ═══════ */
function optimize(){
  if(pts.length<2){ toast("至少要有 2 個點"); return; }
  var go=document.getElementById("go");
  go.disabled=true; go.textContent="計算中…";

  getMatrix(pts).then(function(mat){
    var seq = pts.length<=10 ? heldKarp(mat,pts.length) : heurTSP(mat,pts.length);
    order=seq;
    var ordered=seq.map(function(i){ return pts[i]; });

    var avoidPts = getActiveAvoid();
    return Promise.all(STRAT_KEYS.map(function(k){
      return vRoute(ordered, STRATS[k].cfg)
        .then(function(r){ return {key:k, res:r}; })
        .catch(function(){
          // ★ Valhalla 掛了（公開服務限流/斷線）→ 改走 OSRM 備援，至少還能算出路
          return routeFallbackOSRM(ordered)
            .then(function(r){ return {key:k, res:r, fallback:true}; })
            .catch(function(){ return {key:k, res:null}; });
        });
    })).then(function(arr){

      // 有調撥時段 → 為每條碰到調撥的路線補一條「避開版」
      if (avoidPts.length){
        var needFix = arr.filter(function(x){
          if(!x.res) return false;
          var c = checkRouteDetail(x.res.names, new Date(), null);
          return c.warn;
        });
        return Promise.all(needFix.map(function(x){
          return vRoute(ordered, STRATS[x.key].cfg, avoidPts)
            .then(function(r2){ return {key:x.key, res:r2, isAvoid:true, base:x.res}; })
            .catch(function(){ return null; });
        })).then(function(fixes){
          fixes.forEach(function(f){
            if(f && f.res){
              // 用避開版取代原本那條，但保留原名稱加註記
              f.res.avoided = true;
              var idx = arr.findIndex(function(x){ return x.key===f.key; });
              if(idx>=0) arr[idx] = {key:f.key, res:f.res};
            }
          });
          return arr;
        });
      }
      return arr;
    }).then(function(arr){
      plans = arr.filter(function(x){ return x.res; })
                 .map(function(x){
                   var dbx = (typeof checkRoute==="function")
                     ? checkRoute(x.res.names, new Date()) : {warn:false,hits:[]};
                   return { key:x.key, distance:x.res.distance,
                     duration:x.res.duration,
                     engineTime:x.res.engineTime,
                     waitSignal:x.res.waitSignal,
                     geometry:x.res.geometry,
                     legs:x.res.legs, names:x.res.names,
                     signals:x.res.signals, turns:x.res.turns,
                     alleys:x.res.alleys,
                     maneuvers: x.res.maneuvers || [],
                     fallback: !!x.res.fallbackEngine || x.res.engine === "osrm",
                     diaobo: dbx };
                 });
      if(!plans.length) throw new Error("全部失敗");
      plans = dedupPlans(plans);
      sortPlans();
      activePlan=0;
      applyPlan(0);
      go.textContent="重新計算";
      go.disabled=false;
      document.getElementById("nav").classList.add("show");
      var best=plans[0];
      // ★ 備援引擎要講清楚，不能讓人以為是機車專用路線
      if(best.fallback){
        toast("⚠️ 機車引擎忙碌，已改用汽車路線（可能避開機車可走的小巷）",5200);
      } else {
        toast("已算出 "+plans.length+" 條路線 · 推薦「"+STRATS[best.key].label+
              "」· "+best.signals+" 個路口",2400);
      }
    });
  }).catch(function(e){
    console.error(e);
    go.textContent="計算最佳路線"; go.disabled=false;
    toast("路線計算失敗，請檢查網路",2200);
  });
}

/* 幾何相同的路線合併，避免「5 條一樣」的假選擇 */
function dedupPlans(pl){
  function sigOf(p){
    // 取路徑每 ~100m 一個採樣點當特徵串
    if(!p.geometry || !p.geometry.length) return p.key+p.distance;
    var step=Math.max(1, Math.round(100/ (p.distance/p.geometry.length || 1)));
    var s=[];
    for(var i=0;i<p.geometry.length;i+=step){
      s.push(p.geometry[i][0].toFixed(3)+","+p.geometry[i][1].toFixed(3));
    }
    return s.join(";");
  }
  var seen={}, out=[];
  pl.forEach(function(p){
    var sig=sigOf(p);
    if(seen[sig]!==undefined){
      // 已有一條幾乎相同 → 標籤併過去，不重複列
      var kept=out[seen[sig]];
      if(kept.labels.indexOf(STRATS[p.key].label)<0)
        kept.labels.push(STRATS[p.key].label);
    } else {
      seen[sig]=out.length;
      p.labels=[STRATS[p.key].label];
      out.push(p);
    }
  });
  return out;
}

function sortPlans(){
  var cur = plans[activePlan];
  if(sortMode==="signal"){
    // 路口少者優先（少紅綠燈＝少停等）
    plans.sort(function(a,b){
      if(a.signals!==b.signals) return a.signals-b.signals;
      return a.duration-b.duration;
    });
  } else if(sortMode==="time"){
    plans.sort(function(a,b){ return a.duration-b.duration; });
  } else {
    plans.sort(function(a,b){ return a.distance-b.distance; });
  }
  if(cur){
    for(var i=0;i<plans.length;i++) if(plans[i].key===cur.key){ activePlan=i; break; }
  }
}

function applyPlan(i){
  if(!plans[i]) return;
  activePlan=i;
  var p=plans[i];
  route={ distance:p.distance, duration:p.duration,
          geometry:p.geometry, legs:p.legs,
          maneuvers:p.maneuvers, names:p.names,
          cfg:(STRATS[p.key]?STRATS[p.key].cfg:{}),
          waypoints:(function(){
            var seq=(order.length===pts.length&&order.length)?order:pts.map(function(_,i){return i;});
            return seq.slice(1,-1).map(function(i){ return {lat:pts[i].lat,lng:pts[i].lng}; });
          })() };
  render(); save();
}

function renderPlans(){
  var box=document.getElementById("plans");
  if(!plans.length){ box.classList.remove("show"); return; }
  box.classList.add("show");
  box.querySelectorAll(".plan").forEach(function(x){ x.remove(); });
  document.getElementById("pcount").textContent = plans.length;
  document.getElementById("sortby").textContent =
    "排序：" + (sortMode==="signal"?"路口最少":sortMode==="time"?"時間最短":"距離最短");

  var minSig = Math.min.apply(null, plans.map(function(p){ return p.signals; }));

  // 調撥說明
  var noteEl = document.getElementById("diaoboNote");
  var avoidedCount = plans.filter(function(p){ return p.avoided; }).length;
  var act = (typeof activeSegments==="function") ? activeSegments(new Date()) : [];
  if (act.length && avoidedCount){
    var roads = act.slice(0,3).map(function(x){ return x.seg.road; }).join("、");
    noteEl.innerHTML = '<b>🚨 現在是調撥時段</b>（' + roads +
      (act.length>3?" 等"+act.length+"處":"") + '）<br>' +
      '已自動改道避開禁行路段。';
    noteEl.classList.add("show");
  } else if (act.length){
    noteEl.innerHTML = '<b>🚨 現在是調撥時段</b>，但這條路線沒經過調撥路段。';
    noteEl.classList.add("show");
  } else {
    noteEl.classList.remove("show");
  }

  plans.forEach(function(p,i){
    var d=document.createElement("div");
    d.className="plan"+(i===activePlan?" on":"")+(p.signals===minSig?" best":"");
    var sigCls = p.signals===minSig ? "good" : (p.signals>=minSig+3 ? "bad" : "");
    var warnHtml = '';
    if (p.avoided) warnHtml = '<span class="avoided">✔已避調撥</span>';
    else if (p.diaobo && p.diaobo.warn){
      var allPass = p.diaobo.hits.every(function(x){ return x.passable; });
      warnHtml = allPass
        ? '<span class="caution">▲調撥·走外側</span>'
        : '<span class="warn">⛔禁行調撥</span>';
    }
    d.innerHTML=
      '<div class="tag '+(TAG_CLASS[p.key]||"a")+'"></div>'+
      '<div class="inf"><div class="d">'+
        '<span class="dist"></span>'+
        '<span class="sig '+sigCls+'"></span>'+ warnHtml +
      '</div><div class="n"></div></div>'+
      (p.signals===minSig?'<div class="star">★</div>':'')+
      '<div class="rad"></div>';
    d.querySelector(".tag").textContent=(p.labels||[STRATS[p.key].label]).join("+");
    d.querySelector(".dist").textContent=fmtDist(p.distance)+" · "+fmtTime(p.duration);
    var sigTxt = "路口 "+p.signals+" 個";
    d.querySelector(".sig").textContent=sigTxt;
    var nm2 = (p.alleys?p.alleys+"條巷弄 · ":"")+(p.names.slice(0,3).join(" → ")||"—");
    if (p.diaobo && p.diaobo.warn){
      var lines = p.diaobo.hits.map(function(x){
        var advice = (typeof adviceText==="function") ? adviceText(x) : "";
        return x.road + "（" + x.rule.dir + "）" + advice;
      });
      nm2 = lines.join(" ｜ ");
    }
    d.querySelector(".n").textContent = nm2;
    d.onclick=function(){ applyPlan(i); };
    box.appendChild(d);
  });
}

/* ═══════ 导航 ═══════ */
function openNav(){
  if(!route){ toast("請先計算路線"); return; }
  if(!route.maneuvers || !route.maneuvers.length){
    toast("路線資料不完整，改用外部地圖",2200);
    openExternalMap();
    return;
  }
  if(typeof startNav==="function"){
    startNav(route, null);
  } else {
    openExternalMap();
  }
}

/* 備用：外部 Google 地圖（用 maps 深層連結，減少跳轉確認） */
function openExternalMap(){
  var seq=(order.length===pts.length&&order.length)?order:pts.map(function(_,i){return i;});
  var c=seq.map(function(i){ return pts[i].lat+","+pts[i].lng; });
  var url="https://www.google.com/maps/dir/?api=1"+
    "&origin="+c[0]+"&destination="+c[c.length-1]+
    (c.length>2?"&waypoints="+encodeURIComponent(c.slice(1,-1).join("|")):"")+
    "&travelmode=driving&dir_action=navigate";
  window.open(url,"_blank");
}

/* ═══════ 定位 ═══════ */
function locate(){
  if(!navigator.geolocation){ toast("此裝置不支援定位"); return; }
  toast("定位中…",4000);
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude, lo=pos.coords.longitude;
    map.setView([la,lo],16);
    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.circleMarker([la,lo],{radius:9,color:"#fff",weight:2.5,
      fillColor:"#22c55e",fillOpacity:1}).addTo(map).bindTooltip("你在這裡",{direction:"top"});
    if(pts.length===0){ addPoint("我的位置",la,lo,true); toast("已設為起點",1600); }
  },function(){ toast("無法定位（需開 GPS 並允許權限）",2600); },
  {enableHighAccuracy:true,timeout:14000,maximumAge:20000});
}

/* ═══════ 事件 ═══════ */
function bind(){
  var a=document.getElementById("addr");
  a.addEventListener("input",function(){ searchAddr(a.value.trim()); });
  a.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      e.preventDefault();
      var box=document.getElementById("sug");
      if(box.style.display==="block"&&box.firstChild) box.firstChild.click();
      else searchAddr(a.value.trim());
    }
  });
  document.getElementById("add").onclick=function(){
    var v=a.value.trim();
    if(!v){ toast("請先輸入地址"); return; }
    toast("搜尋中…",2500);
    fetch(PHOTON+"?q="+encodeURIComponent(v)+"&limit=1&lang=default&lat=25.0069&lon=121.4994")
      .then(function(r){ return r.json(); })
      .then(function(d){
        var f=(d.features||[])[0];
        if(!f){ toast("找不到，試試加區名或更簡短"); return; }
        var p=f.properties||{};
        addPoint(p.name||p.street||v,f.geometry.coordinates[1],f.geometry.coordinates[0],false);
        a.value=""; hideSug();
      }).catch(function(){ toast("搜尋失敗，請檢查網路"); });
  };
  document.getElementById("gps").onclick=locate;
  document.getElementById("go").onclick=optimize;
  document.getElementById("nav").onclick=openNav;
  document.getElementById("clear").onclick=function(){
    if(!pts.length) return;
    if(!confirm("確定清空所有地點？")) return;
    pts=[]; order=[]; route=null; plans=[]; activePlan=0;
    render(); save();
    document.getElementById("nav").classList.remove("show");
    document.getElementById("go").textContent="計算最佳路線";
  };
  document.getElementById("sortby").onclick=function(){
    sortMode = sortMode==="signal" ? "time" : (sortMode==="time" ? "dist" : "signal");
    if(plans.length){ sortPlans(); renderPlans(); applyPlan(activePlan); }
    else toast("計算後才能排序",1200);
  };
  var sheet=document.getElementById("sheet");
  document.getElementById("handle").onclick=function(){ sheet.classList.toggle("collapsed"); };
  document.getElementById("map").addEventListener("click",hideSug);
}

/* ═══════ 調撥車道橫幅 ═══════ */
function updateDiaoboBar(){
  var bar = document.getElementById("diaoboBar");
  if (typeof inDiaoboWindow !== "function"){ bar.classList.remove("show"); return; }
  var now = new Date();
  var act = inDiaoboWindow(now);
  if (act && act.length){
    var roads = act.slice(0,4).map(function(a){ return a.road; }).join("、");
    var hh = ("0"+now.getHours()).slice(-2);
    bar.innerHTML = "🚨 現在是調撥時段（"+hh+":00）<br>"+
      '<span class="sub">機車禁行：' + roads +
      (act.length>4?" 等"+act.length+"處":"") + "｜一般機車誤入罰 600~1800</span>";
    bar.classList.add("show");
  } else {
    var tw = (typeof timeWarnText === "function") ? timeWarnText() : "";
    if (tw){
      bar.innerHTML = tw;
      bar.classList.add("show");
    } else {
      bar.classList.remove("show");
    }
  }
}

/* ═══════ 启动 ═══════ */
(function(){
  initMap(); load(); bind(); render();
  updateDiaoboBar();
  setInterval(updateDiaoboBar, 60000);   // 每分钟检查
  if(!pts.length) setTimeout(function(){ toast("輸入地址，或按 ◎ 定位自己",2800); },700);
})();
</script>
<script>
/* ═══════ 手機自檢面板 ═══════ */
(function(){
  var btn=document.getElementById("chk");
  var modal=document.getElementById("chkmodal");
  var rows=document.getElementById("chkrows");
  if(!btn||!modal) return;

  function row(k,v,cls){
    return '<div class="chkrow"><b>'+k+'</b><span class="'+(cls||"")+'">'+v+'</span></div>';
  }

  function runCheck(){
    rows.innerHTML='<div class="chkrow"><b>檢測中…</b><span>請開 GPS 並保持畫面</span></div>';
    var html=[];
    var ua=navigator.userAgent;
    var brand="未知";
    if(/Xiaomi|Redmi|MI |HyperOS/i.test(ua)) brand="Xiaomi/Redmi";
    else if(/Pixel|Google/i.test(ua)) brand="Google Pixel";
    else if(/SM-|Samsung/i.test(ua)) brand="Samsung";
    else if(/HUAWEI|HarmonyOS/i.test(ua)) brand="Huawei";
    html.push(row("手機品牌",brand));
    // 拿真實機型（Chrome 支援；點自檢=使用者手势，可用）
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      html.push('<div class="chkrow"><b>機型</b><span id="brandcell">查詢中…</span></div>');
      navigator.userAgentData.getHighEntropyValues(["model","platformVersion"])
        .then(function(hi){
          var el=document.getElementById("brandcell");
          if(el && hi.model){
            el.textContent=hi.model+(hi.platformVersion?(" · "+hi.platformVersion):"");
          } else if(el){ el.textContent="查不到"; }
        }).catch(function(){
          var el=document.getElementById("brandcell");
          if(el) el.textContent="查不到";
        });
    }
    html.push(row("系統",/Android\s([\d.]+)/i.test(ua)?("Android "+ua.match(/Android\s([\d.]+)/i)[1]):(ua.indexOf("iPhone")>=0?"iOS":(ua.indexOf("Mac")>=0?"macOS":"其他"))));
    html.push(row("瀏覽器",ua.indexOf("Chrome/")>=0&&ua.indexOf("Edg/")<0?("Chrome "+(ua.match(/Chrome\/([\d.]+)/)||[0,"?"])[1]):"其他"));
    var inWx = /MicroMessenger/i.test(ua);
    html.push(row("微信內瀏覽器", inWx ? "⚠️ 是 → 語音會失效，請用 Chrome 開" : "否 ✅", inWx ? "warn" : ""));
    html.push(row("觸控點數",navigator.maxTouchPoints||1));
    html.push(row("螢幕",screen.width+"×"+screen.height+" @"+(devicePixelRatio||1)+"x"));

    // 能力
    var cap=[];
    var natTTS=(function(){ try{ return !!(window.AndroidTTS && window.AndroidTTS.ready && window.AndroidTTS.ready()); }catch(e){ return false; } })();
    cap.push(['GPS定位', !!navigator.geolocation]);
    cap.push(['語音TTS', natTTS || !!window.speechSynthesis]);
    cap.push(['螢幕常亮', !!navigator.wakeLock]);
    cap.push(['震動', !!navigator.vibrate]);
    cap.push(['離線執行緒', !!window.Worker]);
    cap.forEach(function(c){ html.push(row(c[0], c[1]?"支援 ✅":"不支援 ❌", c[1]?"":"bad")); });

    // 網路狀態
    var online = navigator.onLine!==false;
    html.push(row("目前網路", online?"在線 ✅":"斷線 ⚠️", online?"":"warn"));

    // 語音包：APK 內用原生引擎，不依賴網頁語音列表
    if(natTTS){
      var langTxt="zh-TW";
      try{ langTxt=window.AndroidTTS.lang()||"zh-TW"; }catch(e){}
      html.push('<div class="chkrow"><b>語音包</b><span>手機原生語音引擎 ✅ ('+langTxt+')</span></div>');
    } else {
    // TTS 语音列表（Chrome 首次常回空，需等 voiceschanged）
    try{
      var vs=speechSynthesis.getVoices();
      function paint(list){
        var zh=list.filter(function(v){return /^zh/i.test(v.lang);});
        var txt = !list.length ? "讀取中…" :
                  (zh.length ? ("中文 "+zh.length+" 個 ✅ ("+(zh[0].name||"").slice(0,16)+")")
                             : ("只有英文 "+list.length+" 個 ⚠️ 可能唸不出中文"));
        var cls = zh.length ? "" : (list.length ? "warn" : "bad");
        return {txt:txt, cls:cls};
      }
      var p0=paint(vs);
      html.push('<div class="chkrow"><b>語音包</b><span id="vo_cell" class="'+p0.cls+'">'+p0.txt+'</span></div>');
      if(!vs.length){
        speechSynthesis.onvoiceschanged=function(){
          var p=paint(speechSynthesis.getVoices());
          var el=document.getElementById("vo_cell");
          if(el){ el.textContent=p.txt; el.className=p.cls; }
        };
        // Some browsers need a kick
        try{ var kk=new SpeechSynthesisUtterance(" "); kk.volume=0; speechSynthesis.speak(kk); }catch(e){}
      }
    }catch(e){ html.push(row("語音包","讀取失敗 ❌","bad")); }
    }

    rows.innerHTML=html.join("");

    // 精度實測（12 秒取樣）
    if(!navigator.geolocation){ rows.insertAdjacentHTML("beforeend", row("GPS精度實測","無定位 API ❌","bad")); return; }
    rows.insertAdjacentHTML("beforeend", '<div class="chkrow" id="gpsrow"><b>GPS精度</b><span id="gpsv">實測中 0/5…</span></div>');
    var accs=[], cnt=0, done=false;
    // ★ 20 秒兜底：收不到卫星也要给结论，不能让面板永远停在 0/5（看起来像卡死）
    var deadline=setTimeout(function(){
      if(done) return;
      done=true;
      try{ navigator.geolocation.clearWatch(w); }catch(e){}
      var el=document.getElementById("gpsv");
      if(el){
        var txt = cnt ? ("只拿到 "+cnt+" 次（±"+Math.round(Math.min.apply(null,accs))+"m 起）→ 室內訊號弱，到戶外再測")
                      : "20 秒內拿不到定位 → 室內正常，到戶外再測，或檢查定位權限";
        el.textContent=txt; el.className="warn";
      }
    },20000);
    var w=navigator.geolocation.watchPosition(function(p){
      cnt++; accs.push(p.coords.accuracy);
      var best=Math.min.apply(null,accs), avg=Math.round(accs.reduce(function(a,b){return a+b},0)/accs.length);
      var el=document.getElementById("gpsv");
      if(el) el.textContent="第"+cnt+"次 ±"+Math.round(p.coords.accuracy)+"m (最佳 ±"+Math.round(best)+"m)";
      if(cnt>=5){
        done=true; clearTimeout(deadline);
        navigator.geolocation.clearWatch(w);
        var grade, cls, hint;
        if (best <= 10) { grade = "導航級 ✅"; cls = ""; hint = ""; }
        else if (best <= 30) { grade = "可用 ⚠️"; cls = "warn"; hint = ""; }
        else if (best <= 150) { grade = "偏差大 ⚠️"; cls = "warn"; hint = "　（在室內常見，到戶外空曠處會好很多）"; }
        else { grade = "室內定位 ❌"; cls = "bad"; hint = "　→ 這個數字是在屋內用 WiFi 基地台定位，**不是手機壞**。騎到戶外空曠處再測一次。"; }
        if(el){ el.textContent="最佳 ±"+Math.round(best)+"m · 平均 ±"+avg+"m → "+grade+hint; el.className=cls; }
      }
    }, function(err){
      done=true; clearTimeout(deadline);
      var el=document.getElementById("gpsv");
      if(el){ el.textContent="失敗："+err.message+"（檢查定位權限）"; el.className="bad"; }
      navigator.geolocation.clearWatch(w);
    }, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
  }

  btn.onclick=function(){ modal.classList.add("show"); runCheck(); runCheckUi(); };

  // 離線地圖面板開關
  var offBtn=document.getElementById("off");
  var offPanel=document.getElementById("offPanel");
  if(offBtn&&offPanel){
    offBtn.onclick=function(){ offPanel.classList.add("show"); };
    var oc=document.getElementById("offClose");
    if(oc) oc.onclick=function(){ offPanel.classList.remove("show"); };
    offPanel.addEventListener("click",function(e){
      if(e.target===offPanel) offPanel.classList.remove("show");
    });
  }

  // ★ 字體大小切換：三段（標準/大字/超大），記在 localStorage，重開還記得
  (function(){
    var KEY="routeApp_ui", STEPS=[1, 1.25, 1.5, 1.8], NAMES=["標準","大字","超大","巨大"];
    var b=document.getElementById("uiBig");
    if(!b) return;
    var cur=parseFloat(localStorage.getItem(KEY));
    if(!cur || STEPS.indexOf(cur)<0) cur=1.25;   // 預設就用大字
    function apply(){
      document.documentElement.style.setProperty("--ui", cur);
      // 地圖/導航區也要跟著（nav.js 用自己的一套 CSS 變數）
      document.documentElement.style.setProperty("--uiScale", cur);
      b.textContent="AA "+(NAMES[STEPS.indexOf(cur)]||"");
      try{ localStorage.setItem(KEY, cur); }catch(e){}
      if(window.NAV && NAV.refreshUi) NAV.refreshUi();
    }
    b.onclick=function(){
      var i=STEPS.indexOf(cur);
      cur=STEPS[(i+1)%STEPS.length];
      apply();
      toast("字體："+(NAMES[STEPS.indexOf(cur)]||""),1400);
    };
    apply();
  })();
  document.getElementById("chkclose").onclick=function(){ modal.classList.remove("show"); };

  // 在微信裡 → 給「一鍵到 Chrome」的按鈕（微信會攔 scheme，所以用 intent + 引導）
  function offerChrome(){
    if(!/MicroMessenger/i.test(navigator.userAgent)) return;
    if(document.getElementById("wxfix")) return;
    var box=document.getElementById("chkbtns");
    if(!box) return;
    var b=document.createElement("button");
    b.className="btn"; b.id="wxfix"; b.textContent="用 Chrome 開（修語音）";
    b.style.background="#2b6cb0";
    b.onclick=function(){
      var here=location.href;
      // Android：intent 直接指定 Chrome
      var intent="intent://"+here.replace(/^https?:\/\//,"")+
        "#Intent;scheme=https;package=com.android.chrome;end";
      try{ location.href=intent; }catch(e){}
      setTimeout(function(){
        // 失敗就給可複製的網址 + 手把手步驟
        try{ navigator.clipboard.writeText(here); }catch(e){}
        toast("已複製網址 → 點右上「…」→ 在瀏覽器開啟",6000);
      },1200);
    };
    box.insertBefore(b, box.firstChild);
  }

  function runCheckUi(){ offerChrome(); }
  document.getElementById("chkspeak").onclick=function(){
    try{
      var u=new SpeechSynthesisUtterance("前方五十公尺，右轉進入中正路");
      u.lang="zh-TW"; u.rate=0.95;
      var vs=speechSynthesis.getVoices();
      for(var i=0;i<vs.length;i++){ if(/^zh/i.test(vs[i].lang)){ u.voice=vs[i]; break; } }
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      toast("正在唸…（沒聲=小米 TTS 未開或選錯引擎）",3000);
    }catch(e){ toast("唸錯："+e.message,2500); }
  };
  modal.addEventListener("click",function(e){ if(e.target===modal) modal.classList.remove("show"); });
})();
</script>

        console.log("[SW] 已註冊 scope=", reg.scope);
